services:
  # ============================================================
  # AUTH: Ory Kratos (self-hosted) + PG externa + Cloudflare R2.
  # Kratos ownea credenciales (argon2, OTP 6 dígitos por email); Go minta
  # JWTs API cortos + refresh opacos. Uploads a R2 con fallback a disco.
  # DBs en la PG externa (proyecto refer-db): `postgres` (negocio) + `kratos`.
  # Vars: KRATOS_* + AUTH_* + R2_* en .env / Environment de Dokploy.
  # ============================================================

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    restart: on-failure
    environment:
      DSN: postgres://postgres:${DB_PASSWORD:?DB_PASSWORD requerido}@${DB_HOST_EXTERNAL}:${DB_PORT_EXTERNAL}/kratos?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]
    networks:
      - refer_network

  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://postgres:${DB_PASSWORD:?DB_PASSWORD requerido}@${DB_HOST_EXTERNAL}:${DB_PORT_EXTERNAL}/kratos?sslmode=disable
      SECRETS_CIPHER_0: ${KRATOS_SECRETS_CIPHER:?KRATOS_SECRETS_CIPHER requerido (openssl rand -hex 16)}
      SECRETS_COOKIE_0: ${KRATOS_SECRETS_COOKIE:?KRATOS_SECRETS_COOKIE requerido (openssl rand -hex 32)}
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_URI:-smtp://localhost:1025/}
    volumes:
      - ./kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["serve", "all", "--watch-courier", "--config", "/etc/config/kratos/kratos.yml"]
    ports:
      - "127.0.0.1:${KRATOS_PUBLIC_PORT:-4433}:4433"
      - "127.0.0.1:${KRATOS_ADMIN_PORT:-4434}:4434"
    networks:
      - refer_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Orden de arranque: Go espera a Kratos (migrado). La DB externa no
    # tiene depends_on entre proyectos: restart + retries + health gate.
    depends_on:
      kratos:
        condition: service_started
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      # Usa DB_HOST/DB_PORT del Environment de Dokploy si se apunta a un PG externo.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSLMODE: disable
      # DB externa (proyecto refer-db): tiene prioridad sobre DB_*.
      # Default = IP externa acordada; override con APP_DATABASE_URL en Dokploy.
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://postgres:${DB_PASSWORD:?DB_PASSWORD requerido}@${DB_HOST_EXTERNAL:-149.202.62.87}:${DB_PORT_EXTERNAL:-5433}/postgres?sslmode=disable}
      # Ory Kratos: dentro del compose, Go habla por red interna
      # (http://kratos:4433/4434). `go run` local usa KRATOS_*_URL del .env
      # (http://localhost:4433/4434). Overrides: APP_KRATOS_*_URL.
      KRATOS_PUBLIC_URL: ${APP_KRATOS_PUBLIC_URL:-http://kratos:4433}
      KRATOS_ADMIN_URL: ${APP_KRATOS_ADMIN_URL:-http://kratos:4434}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET requerido (openssl rand -base64 48)}
      AUTH_JWT_EXP_SEC: ${AUTH_JWT_EXP_SEC:-3600}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-30}
      # Cloudflare R2 (S3-compatible): uploads + fallback a disco.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_UPLOADS_URL: ${R2_PUBLIC_UPLOADS_URL:-}
      R2_PUBLIC_PRODUCTS_URL: ${R2_PUBLIC_PRODUCTS_URL:-}
      R2_PUBLIC_AVATARS_URL: ${R2_PUBLIC_AVATARS_URL:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - refer_network
      #- dokploy-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - tmp/
            - uploads/
            - node_modules/
            - .git/
        - action: sync
          path: ./uploads
          target: /app/uploads
          ignore:
            - "*.tmp"

volumes:
  uploads_data:
    driver: local

networks:
  refer_network:
    driver: bridge
  #dokploy-network:
    #external: true
