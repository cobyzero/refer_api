services:
  postgres:
    image: postgres:16-alpine
    container_name: refer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-refer}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-refer}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - refer_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refer_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Override DB_HOST to use docker service name when running in compose
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
      SEED_DB: ${SEED_DB:-false}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - refer_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  refer_network:
    driver: bridge
