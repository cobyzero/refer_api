services:
  # ============================================================
  # SUPABASE SELF-HOSTED lean SIN db local (db externa supabase/postgres):
  #   DB en 149.202.62.87:5433 (proyecto refer-db separado).
  # Arquitectura: Flutter -> Go -> Kong (:8000) -> Auth/PostgREST -> PG externa.
  # Este repo no crea ni persiste PG: el server la verifica y migra al arrancar
  # (CheckSupabaseDB + Migrate + EnsureStorage), sin archivos en la DB.
  # Vars externas: DB_HOST_EXTERNAL / DB_PORT_EXTERNAL / SUPABASE_POSTGRES_PASSWORD
  # (idéntico al de refer-db, solo [A-Za-z0-9-], fijado una vez).
  # ============================================================

  supabase-auth:
    image: supabase/auth:v2.196.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1
      GOTRUE_API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-http://localhost:3000}
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${SUPABASE_POSTGRES_PASSWORD:-tu-password-alfanumerico-fijo}@${DB_HOST_EXTERNAL:-149.202.62.87}:${DB_PORT_EXTERNAL:-5433}/postgres?search_path=auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-3600}
      GOTRUE_MAILER_AUTOCONFIRM: ${SUPABASE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_MAILER_OTP_EXP: ${SUPABASE_MAILER_OTP_EXP:-600}
      # Plantilla OTP (código de 6 dígitos {{ .Token }}) en vez del link default.
      # GoTrue la descarga por HTTP: debe ser URL absoluta alcanzable desde
      # este contenedor. Default = Go del compose por DNS interno.
      # Dev con `go run` local: SUPABASE_MAILER_TEMPLATE_CONFIRMATION=http://host.docker.internal:3000/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${SUPABASE_MAILER_TEMPLATE_CONFIRMATION:-http://app:3000/templates/confirmation.html}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_LOG_LEVEL: error
      # SMTP (Resend): set SMTP_PASS=re_xxx in .env to send real OTP emails.
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Refer App}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - refer_network

  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${SUPABASE_POSTGRES_PASSWORD:-tu-password-alfanumerico-fijo}@${DB_HOST_EXTERNAL:-149.202.62.87}:${DB_PORT_EXTERNAL:-5433}/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      - refer_network

  supabase-kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
    ports:
      - "${SUPABASE_KONG_HTTP_PORT:-8000}:8000"
      - "${SUPABASE_KONG_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - refer_network

  supabase-storage:
    image: supabase/storage-api:v1.73.0
    restart: unless-stopped
    depends_on:
      supabase-rest:
        condition: service_started
    environment:
      PORT: 5000
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      DATABASE_URL: postgres://postgres:${SUPABASE_POSTGRES_PASSWORD:-tu-password-alfanumerico-fijo}@${DB_HOST_EXTERNAL:-149.202.62.87}:${DB_PORT_EXTERNAL:-5433}/postgres?search_path=storage,public
      FILE_SIZE_LIMIT: ${SUPABASE_STORAGE_FILE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GOTRUE_URL: http://supabase-auth:9999
    volumes:
      - supabase_storage_data:/var/lib/storage
    networks:
      - refer_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Orden de arranque: Go espera a Kong (Auth ya debe estar healthy).
    # La DB externa no tiene depends_on entre proyectos: restart + retries.
    depends_on:
      supabase-kong:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      # Usa DB_HOST/DB_PORT del Environment de Dokploy si se apunta a un PG externo.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSLMODE: disable
      # DB externa supabase/postgres (proyecto refer-db): tiene prioridad sobre DB_*.
      # Default = IP externa acordada; override con APP_DATABASE_URL en Dokploy.
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://postgres:${SUPABASE_POSTGRES_PASSWORD:-tu-password-alfanumerico-fijo}@${DB_HOST_EXTERNAL:-149.202.62.87}:${DB_PORT_EXTERNAL:-5433}/postgres?sslmode=disable}
      # Supabase Auth: dentro del compose, Go habla con Kong
      # por red interna. `go run` local usa el SUPABASE_URL del .env
      # (http://localhost:8000). Override explícito: APP_SUPABASE_URL.
      SUPABASE_URL: ${APP_SUPABASE_URL:-http://supabase-kong:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - refer_network
      #- dokploy-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - tmp/
            - uploads/
            - node_modules/
            - .git/
        - action: sync
          path: ./uploads
          target: /app/uploads
          ignore:
            - "*.tmp"

volumes:
  supabase_storage_data: # archivos de Storage (NO borrar sin backup)
    driver: local
  uploads_data:
    driver: local

networks:
  refer_network:
    driver: bridge
  #dokploy-network:
    #external: true
