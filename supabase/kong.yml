# Kong declarative config (DB-less) — Supabase gateway for Refer App.
#
# Auth + PostgREST + Storage are exposed because the architecture is:
#   Flutter -> Go -> Kong -> (Auth | PostgREST | Storage)
# Flutter NEVER talks to Supabase directly, so only Auth/PostgREST/Storage
# routes are published. JWTs are validated by GoTrue / PostgREST / Storage themselves
# (HS256, SUPABASE_JWT_SECRET); Kong only routes + CORS.

_format_version: "1.1"

services:
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
