# Ory Kratos - parte estática. Secretos/DSN/SMTP por environment
# (DSN, SECRETS_CIPHER_0, SECRETS_COOKIE_0, COURIER_SMTP_CONNECTION_URI).
# Toda la config acepta override por env (docs/oss/configuring).
dsn: memory

serve:
  public:
    base_url: http://kratos:4433/
    host: 0.0.0.0
    port: 4433
  admin:
    base_url: http://kratos:4434/
    host: 0.0.0.0
    port: 4434

selfservice:
  default_browser_return_url: http://app:3000/
  allowed_return_urls:
    - http://app:3000
  methods:
    password:
      enabled: true
    code:
      enabled: true
  flows:
    error:
      ui_url: http://app:3000/auth/error
    settings:
      ui_url: http://app:3000/auth/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      ui_url: http://app:3000/auth/recovery
      use: code
    verification:
      enabled: true
      ui_url: http://app:3000/auth/verification
      use: code
    logout:
      after:
        default_browser_return_url: http://app:3000/
    login:
      ui_url: http://app:3000/auth/login
      lifespan: 10m
    registration:
      lifespan: 10m
      ui_url: http://app:3000/auth/registration
      after:
        password:
          hooks:
            - hook: session

log:
  level: error
  format: text

secrets:
  cookie:
    - change-me-via-SECRETS_COOKIE_0-env
  cipher:
    - change-me-via-SECRETS_CIPHER_0-env-32c

ciphers:
  algorithm: xchacha20-poly1305

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://localhost:1025/
